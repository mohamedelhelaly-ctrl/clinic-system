<!doctype html>
<!-- Generated by build-vertical.mjs from scenes-vertical.mjs and camera.json. Edit those, then run: node build-vertical.mjs -->
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
/*
 * Pulse brand tokens for the promo video.
 *
 * The base teal is the brand colour. The others are derived from it in HSL,
 * keeping its hue (179.5°) and changing lightness and saturation:
 *
 *   --teal       #0e7c7b  base       HSL(179.5, 80%, 27%)
 *   --teal-dark  #094e4d  darker     HSL(179.5, 80%, 17%)   caption text, title-card text
 *   --teal-tint  #e9f6f6  light tint HSL(179.5, 42%, 94%)   title-card ground, soft fills
 *   --bg         #f7fbfb  near-white with a faint teal tint, HSL(179.5, 30%, 97.5%), app-scene ground
 *
 * Contrast (WCAG 2.x):
 *   white on --teal          5.01:1  (hook, end card, chips, flash pill)
 *   --teal-dark on white     9.51:1  (caption pill)
 *   --teal-dark on --teal-tint 8.59:1  (title cards)
 */
:root {
  --teal: #0e7c7b;
  --teal-dark: #094e4d;
  --teal-tint: #e9f6f6;
  --bg: #f7fbfb;
  --white: #ffffff;
  --ink: #102322;
  --shadow-teal: rgba(9, 78, 77, 0.16);

  --font-ar: "Cairo", sans-serif;
  --font-latin: "Figtree", sans-serif;

  /* 5% safe margin on every side at 1920x1080 */
  --safe-x: 96px;
  --safe-y: 54px;
}

@font-face {
  font-family: "Cairo";
  src: url("fonts/Cairo-VariableFont.ttf") format("truetype");
  font-weight: 200 1000;
  font-display: block;
}

@font-face {
  font-family: "Figtree";
  src: url("fonts/Figtree-VariableFont.ttf") format("truetype");
  font-weight: 300 900;
  font-display: block;
}

/* Vertical (1080x1920) components. build-vertical.mjs inlines ../composition/brand.css and then this file.
 * Safe layout: nothing in y < 140 or y > 1660. Header 140-260, app area 280-1340, captions 1380-1660. */

#root {
  position: absolute;
  inset: 0;
  overflow: hidden;
  font-family: var(--font-ar);
  color: var(--ink);
}

.scene {
  position: absolute;
  inset: 0;
  background: radial-gradient(130% 70% at 50% 0%, #ffffff 0%, var(--bg) 55%, #eef6f6 100%);
}

/* ---- Header ------------------------------------------------------------- */

.wordmark {
  position: absolute;
  left: 60px;
  top: 170px;
  height: 60px;
  z-index: 30;
}
.wordmark svg { height: 100%; width: auto; display: block; }

.chip {
  position: absolute;
  right: 60px;
  top: 164px;
  z-index: 30;
  direction: rtl;
  background: var(--teal);
  color: var(--white);
  font: 700 38px/1 var(--font-ar);
  padding: 13px 38px 17px;
  border-radius: 999px;
}

/* ---- App card (virtual camera) ----------------------------------------- */

.card-app {
  position: absolute;
  left: 40px;
  width: 1000px;
  border-radius: 28px;
  overflow: hidden;
  background: #fff;
  border: 1px solid rgba(14, 124, 123, 0.14);
  box-shadow: 0 30px 70px rgba(9, 78, 77, 0.16), 0 6px 18px rgba(9, 78, 77, 0.08);
  z-index: 1;
}
.cam {
  position: absolute;
  left: 0;
  top: 0;
  width: 2560px;
  height: 1440px;
  transform-origin: 0 0;
  will-change: transform;
}
.cam video,
.cam img {
  position: absolute;
  left: 0;
  top: 0;
  width: 2560px;
  height: 1440px;
}

/* ---- Phone and laptop frames ------------------------------------------- */

.phone {
  position: absolute;
  padding: 12px;
  border-radius: 54px;
  background: #142a2a;
  box-shadow: 0 34px 80px rgba(9, 78, 77, 0.24), 0 6px 18px rgba(9, 78, 77, 0.1);
}
.phone .screen {
  position: relative;
  overflow: hidden;
  border-radius: 42px;
  background: #fff;
  width: 100%;
  height: 100%;
}
.phone .screen video {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.laptop { position: absolute; }
.laptop .lid {
  padding: 16px;
  border-radius: 22px 22px 6px 6px;
  background: #142a2a;
  box-shadow: 0 30px 70px rgba(9, 78, 77, 0.18);
}
.laptop .screen { position: relative; overflow: hidden; border-radius: 6px; background: #fff; }
.laptop .screen img { display: block; width: 100%; height: 100%; object-fit: cover; }
.laptop .base {
  height: 24px;
  margin: 0 -40px;
  border-radius: 0 0 22px 22px;
  background: linear-gradient(#d9e3e3, #b9c8c8);
  box-shadow: 0 16px 30px rgba(9, 78, 77, 0.14);
}
.laptop .base::after {
  content: "";
  display: block;
  width: 160px;
  height: 9px;
  margin: 0 auto;
  border-radius: 0 0 10px 10px;
  background: #a9b9b9;
}

/* ---- Full-frame cards --------------------------------------------------- */

.card {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  direction: rtl;
  text-align: center;
  z-index: 40;
}
.card.teal { background: radial-gradient(120% 80% at 50% 35%, #12908f 0%, var(--teal) 55%, #0b6766 100%); color: var(--white); }
.card.tint { background: var(--teal-tint); color: var(--teal-dark); }
.card-text {
  text-wrap: balance;
  font: 800 108px/1.4 var(--font-ar);
  max-width: 960px;
  padding: 0 0;
}

/* ---- Captions (no pill; dark teal on the near-white ground) ------------- */

.cap {
  position: absolute;
  left: 60px;
  right: 60px;
  top: 1380px;
  height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cap-text {
  direction: rtl;
  text-align: center;
  max-width: 960px;
  color: var(--teal-dark);
  font: 800 58px/1.45 var(--font-ar);
  text-wrap: balance;
}
.cap-text.flash {
  background: var(--teal);
  color: var(--white);
  padding: 10px 40px 16px;
  border-radius: 40px;
}
.cap-text .line { display: block; }

/* ---- Messaging-app graphic, portrait (generic, no trademarked assets) -- */

.chat {
  position: absolute;
  inset: 0;
  z-index: 20;
  background: radial-gradient(130% 70% at 50% 0%, #ffffff 0%, var(--bg) 55%, #eef6f6 100%);
}
.chat .panel {
  position: absolute;
  left: 40px;
  top: 280px;
  width: 1000px;
  height: 1060px;
  border-radius: 34px;
  overflow: hidden;
  border: 1px solid rgba(14, 124, 123, 0.14);
  box-shadow: 0 30px 70px rgba(9, 78, 77, 0.16), 0 6px 18px rgba(9, 78, 77, 0.08);
}
.msg-app {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  direction: rtl;
  font-family: var(--font-ar);
  background-color: #edf1ee;
  background-image: radial-gradient(rgba(16, 35, 34, 0.05) 1.8px, transparent 1.9px);
  background-size: 28px 28px;
}
.msg-head {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 24px 30px;
  background: #f6f8f7;
  border-bottom: 1px solid rgba(16, 35, 34, 0.08);
}
.msg-head .avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--teal-tint);
  display: flex;
  align-items: center;
  justify-content: center;
}
.msg-head .name { font: 700 42px/1.2 var(--font-ar); color: #102322; }
.msg-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 22px;
  padding: 28px 20px;
}
.bubble {
  max-width: 960px;
  padding: 20px 30px 14px;
  border-radius: 30px;
  font: 600 48px/1.5 var(--font-ar);
  color: #142322;
  box-shadow: 0 1px 2px rgba(16, 35, 34, 0.14);
}
.bubble.out { align-self: flex-start; background: #d5f5cb; }
.bubble.in { align-self: flex-end; background: #ffffff; }
.bubble .meta {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  direction: ltr;
  margin-top: 6px;
  font: 500 28px/1 var(--font-latin);
  color: #6b7a78;
}
.bubble .ticks { width: 36px; height: 22px; display: block; }
.bubble .actions {
  display: flex;
  margin: 20px -30px -14px;
  border-top: 1px solid rgba(16, 35, 34, 0.1);
}
.bubble .actions span {
  position: relative;
  flex: 1;
  overflow: hidden;
  text-align: center;
  padding: 26px 0 32px;
  font: 800 52px/1 var(--font-ar);
  color: var(--teal);
}
.bubble .actions span + span { border-right: 1px solid rgba(16, 35, 34, 0.1); }
.bubble .actions .ripple {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 640px;
  height: 640px;
  margin: -320px 0 0 -320px;
  border-radius: 50%;
  background: rgba(14, 124, 123, 0.22);
}
.file {
  display: flex;
  align-items: center;
  gap: 28px;
  padding: 24px 28px;
  border-radius: 22px;
  background: #f2f5f4;
}
.file .doc {
  flex: none;
  width: 110px;
  height: 136px;
  border-radius: 12px;
  background: #d9483b;
  color: #fff;
  font: 800 32px/136px var(--font-latin);
  text-align: center;
}
.file .fname { font: 800 50px/1.35 var(--font-ar); color: #142322; }
.file .ftype { font: 600 30px/1.2 var(--font-latin); color: #6b7a78; }
.msg-input {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 18px 24px 28px;
}
.msg-input .field { flex: 1; height: 88px; border-radius: 44px; background: #fff; }
.msg-input .send {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: #22a55a;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ---- End card ------------------------------------------------------------ */

.end-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  width: 960px;
}
.end-stack .logo { width: 360px; }
.end-stack .logo svg { width: 100%; height: auto; display: block; }
.end-stack .tagline { font: 800 64px/1.4 var(--font-ar); }
.end-stack .demo { font: 700 52px/1.45 var(--font-ar); }
.end-stack .contact {
  margin-top: 30px;
  width: 960px;
  direction: rtl;
  background: var(--white);
  color: var(--teal-dark);
  padding: 30px 40px 38px;
  border-radius: 64px;
  box-shadow: 0 18px 44px rgba(4, 40, 40, 0.28);
}
.end-stack .contact .lead { display: block; font: 800 60px/1.4 var(--font-ar); }
.end-stack .contact .num { display: block; direction: ltr; font: 800 104px/1.15 var(--font-latin); letter-spacing: 0.01em; }
.credit {
  position: absolute;
  left: 60px;
  right: 60px;
  top: 1590px;
  text-align: center;
  direction: ltr;
  font: 600 28px/1.3 var(--font-latin);
  color: #ffffff;
  z-index: 41;
}

/* Shown only when the brand fonts failed to load (see index.html). */
#font-error {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 9999;
  align-items: center;
  justify-content: center;
  background: #c62828;
  color: #fff;
  font: 700 56px/1.2 monospace;
  text-align: center;
}

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #main { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="108.55" data-width="1080" data-height="1920" data-fps="30">

      <div id="booking" data-composition-id="booking" data-composition-src="compositions/booking.html" data-start="6.4" data-duration="15.3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="reminder" data-composition-id="reminder" data-composition-src="compositions/reminder.html" data-start="21.1" data-duration="11.65" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:4"></div>

      <div id="doctor" data-composition-id="doctor" data-composition-src="compositions/doctor.html" data-start="57.55" data-duration="6.9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:7"></div>

      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="101.35" data-duration="7.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:12"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="108.55" data-track-index="0" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:100"></div>
      <audio id="music" src="assets/audio/music.m4a" data-start="0" data-duration="108.55" data-track-index="10" data-volume="1" data-fade-in="1.2" data-fade-out="3"></audio>

      <audio id="sfx1" src="assets/audio/sfx-soft-2.ogg" data-start="32.25" data-duration="0.15" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx2" src="assets/audio/sfx-soft-1.ogg" data-start="43.65" data-duration="0.19" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx3" src="assets/audio/sfx-soft-2.ogg" data-start="85.05" data-duration="0.15" data-track-index="11" data-volume="0.55"></audio>
      <div id="font-error">FONTS NOT LOADED:<br>Cairo / Figtree</div>
    </div>
    <script>
      // Fonts gate: the timeline is registered only once both bundled fonts have loaded.
      (async () => {
        const want = ["Cairo", "Figtree"];
        await Promise.all([
          document.fonts.load('800 42px "Cairo"', "بيبي"),
          document.fonts.load('800 42px "Figtree"', "Pulse 0123"),
        ]).catch(() => {});
        const loaded = (fam) => [...document.fonts].some((f) => f.family.replace(/"/g, "") === fam && f.status === "loaded");
        const missing = want.filter((f) => !loaded(f));
        window.__fontsLoaded = missing.length === 0;
        if (missing.length) {
          document.getElementById("font-error").style.display = "flex";
          throw new Error("Fonts not loaded: " + missing.join(", "));
        }
        window.__timelines["main"] = gsap.timeline({ paused: true });
      })();
    </script>
